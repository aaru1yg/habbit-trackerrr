name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (vitest)
        run: npm test

      # Executes supabase/schema.sql against a real PostgreSQL engine and
      # asserts the RLS policies actually deny cross-user access. Catches a
      # broken or weakened schema before it can reach the database.
      - name: Schema + RLS isolation (real PostgreSQL)
        run: npm run test:schema

      - name: Build
        run: npm run build

      - name: Browser journeys and release UI checks
        run: |
          set -euo pipefail
          npm run preview -- --host 0.0.0.0 > /tmp/preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID"' EXIT
          node --input-type=module -e '
            for (let i = 0; i < 60; i++) {
              try { if ((await fetch("http://localhost:4173/")).ok) process.exit(0) } catch {}
              await new Promise(r => setTimeout(r, 500));
            }
            process.exit(1);
          '
          npm run test:e2e
          npm run test:release
          node qa/audit.mjs http://localhost:4173
          for theme in midnight aurora ember verdant daylight; do
            node qa/contrast.mjs http://localhost:4173 "$theme"
          done

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa
          path: qa/shots/
          retention-days: 7

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
