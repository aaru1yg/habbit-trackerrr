name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Also runs qa/build-proof.mjs, which fails the build if the artifact
      # is missing its commit stamp or contains credential-shaped strings.
      - name: Build
        run: npm run build

      # The app must still boot with JavaScript's heavy dependency (WebGL)
      # unavailable — that is the path every phone and every reduced-motion
      # user takes. Serve the real artifact and assert it renders.
      - name: Smoke-test the production artifact
        run: |
          set -euo pipefail
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          trap 'kill %1 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ > /tmp/index.html; then break; fi
            sleep 0.5
          done
          grep -q '<div id="root"></div>' /tmp/index.html
          grep -q '<meta name="build-id"' /tmp/index.html
          echo "Production artifact serves and carries its build identity."
