name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (vitest)
        run: npm test

      # Executes supabase/schema.sql against a real PostgreSQL engine and
      # asserts the RLS policies actually deny cross-user access. Catches a
      # broken or weakened schema before it can reach the database.
      - name: Schema + RLS isolation (real PostgreSQL)
        run: npm run test:schema

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
