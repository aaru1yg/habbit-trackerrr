name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (vitest)
        run: npm test

      # Executes supabase/schema.sql against a real PostgreSQL engine and
      # asserts the RLS policies actually deny cross-user access. Catches a
      # broken or weakened schema before it can reach the database.
      - name: Schema + RLS isolation (real PostgreSQL)
        run: npm run test:schema

      - name: Build
        run: npm run build

      - name: Browser journeys and release UI checks
        run: |
          set -euo pipefail
          npm run preview -- --host 0.0.0.0 > /tmp/preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID"' EXIT
          node --input-type=module -e '
            for (let i = 0; i < 60; i++) {
              try { if ((await fetch("http://localhost:4173/")).ok) process.exit(0) } catch {}
              await new Promise(r => setTimeout(r, 500));
            }
            process.exit(1);
          '
          mkdir -p qa/shots
          # Independent browser profiles; no cloud credentials in this build.
          # The 2-core runner cannot feed four heavy headless-Chromium jobs at
          # once — running e2e+release and audit+contrast as two sequential
          # groups caps concurrency at two browsers, so the layout/font can
          # settle and the timing-sensitive checks are measured on the real,
          # settled DOM rather than a CPU-starved frame.
          npm run test:e2e > qa/shots/e2e.log 2>&1 &
          E2E_PID=$!
          npm run test:release > qa/shots/release.log 2>&1 &
          RELEASE_PID=$!
          set +e
          wait "$E2E_PID"; E2E=$?
          wait "$RELEASE_PID"; RELEASE=$?
          set -e
          node qa/audit.mjs http://localhost:4173 > qa/shots/layout.log 2>&1 &
          LAYOUT_PID=$!
          (
            for theme in midnight aurora ember verdant daylight; do
              node qa/contrast.mjs http://localhost:4173 "$theme"
            done
          ) > qa/shots/contrast.log 2>&1 &
          CONTRAST_PID=$!
          set +e
          wait "$LAYOUT_PID"; LAYOUT=$?
          wait "$CONTRAST_PID"; CONTRAST=$?
          set -e
          set +e
          npm run test:e2e:work > qa/shots/workspace.log 2>&1
          WORKSPACE=$?
          set -e
          STATUS=0
          # Name the script that failed. The annotation filter below only
          # catches lines containing ✗/Error/FAIL, and qa/audit.mjs and
          # qa/contrast.mjs report findings without any of those words — so
          # without this a layout or contrast failure fails the step with no
          # attributable annotation at all.
          report() {
            if [ "$3" -ne 0 ]; then
              STATUS=1
              echo "::error::${1} exited ${3} — tail of ${2} follows"
            fi
          }
          report "qa/workspace-e2e.mjs (Work journeys)" qa/shots/workspace.log "$WORKSPACE"
          report "qa/e2e.mjs (browser journeys)" qa/shots/e2e.log "$E2E"
          report "qa/release.mjs (release UI)" qa/shots/release.log "$RELEASE"
          report "qa/audit.mjs (layout/tap-target audit)" qa/shots/layout.log "$LAYOUT"
          report "qa/contrast.mjs (theme contrast)" qa/shots/contrast.log "$CONTRAST"
          tail -n 35 qa/shots/{e2e,release,layout,contrast,workspace}.log
          exit "$STATUS"

      - name: Publish browser failure details
        if: always()
        run: |
          for log in qa/shots/*.log; do
            [ -f "$log" ] || continue
            echo "## $log" >> "$GITHUB_STEP_SUMMARY"
            cat "$log" >> "$GITHUB_STEP_SUMMARY"
            # Findings, not just crashes. qa/audit.mjs reports "## tap-target — 3"
            # plus one "route  detail  [N vp: …]" line per finding, and
            # qa/contrast.mjs reports "2.9 (need 4.5) …" — neither mentions
            # ✗/Error/FAIL, so a layout or contrast failure was invisible here.
            # The "no page errors" / "0 failing" lines are passes; drop them so
            # the annotation list shows only real findings.
            # One annotation per log, not one per line. GitHub truncates the
            # annotation list, and a per-line fan-out silently dropped the
            # "widest-chain" line that names the element establishing the bad
            # width. %0A is the workflow-command newline escape; % must be
            # escaped first.
            body=$(grep -aE '✗|Error|error|FAIL|^## |vp: |\(need |failing text nodes' "$log" \
              | grep -avE 'no (page|console) errors|— 0 failing' \
              | head -40 \
              | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/$/%0A/' \
              | tr -d '\n')
            if [ -n "$body" ]; then
              echo "::error file=$log::${body}"
            fi
          done

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa
          path: qa/shots/
          retention-days: 7

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
