name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Also runs qa/build-proof.mjs, which fails the build if the artifact
      # is missing its commit stamp or contains credential-shaped strings.
      - name: Build
        run: npm run build

      # Serve the real artifact and assert it renders and carries its stamp.
      - name: Smoke-test the production artifact
        run: |
          set -euo pipefail
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          trap 'kill %1 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ > /tmp/index.html; then break; fi
            sleep 0.5
          done
          grep -q '<div id="root"></div>' /tmp/index.html
          grep -q '<meta name="build-id"' /tmp/index.html
          echo "Production artifact serves and carries its build identity."

  sync:
    name: Auth and sync, end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Drives the real @supabase/supabase-js client over real HTTP, in a real
      # browser, against a local stub standing in for the project. Two browser
      # contexts act as two devices, so the merge, conflict and tombstone paths
      # are exercised rather than asserted. Row level security is the one thing
      # a stub cannot prove; verify-supabase.yml does that against the real
      # database.
      # Each wait fails loudly if the service never answers, so a broken
      # harness cannot masquerade as a passing verification.
      - name: Start the Supabase stub
        run: |
          node qa/supabase-stub.mjs 54321 > /tmp/stub.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:54321/auth/v1/settings > /dev/null && exit 0
            sleep 0.25
          done
          echo "::error::The Supabase stub never became reachable."
          cat /tmp/stub.log
          exit 1

      - name: Start the app against the stub
        env:
          SUPABASE_STUB: '1'
          VITE_SUPABASE_URL: /supabase-stub
          VITE_SUPABASE_PUBLISHABLE_KEY: local-stub-publishable-key
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:5173/ > /dev/null && exit 0
            sleep 0.5
          done
          echo "::error::The dev server never became reachable."
          cat /tmp/dev.log
          exit 1

      - name: Verify sign-up, sync, merge and deletion
        run: node qa/verify-sync.mjs

      - name: Server logs on failure
        if: failure()
        run: |
          echo "--- dev server ---";  cat /tmp/dev.log  || true
          echo "--- stub ---";        cat /tmp/stub.log || true
