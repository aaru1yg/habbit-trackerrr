name: V3 final visual QA

# Test-only closing proof for the V3 UI: real GitHub-hosted Chromium at
# 390×844, 430×932 and 1440×900 against the production build, driven by
# qa/v3-final-visual.mjs. Captures the fifteen V3 surfaces per viewport
# (Today, Work, Habits, Calendar, Habit Detail, Goals, Goal Detail, Goal
# Atlas, Insights, Analytics, Omni, the three forms, sheets/dialogs) plus
# reduced-motion passes, runs the visual battery on each (console/page
# errors, overflow, overlap, clipping, 44px targets, assets, glow) and
# verifies the V3 systems (HabitCard/HabitRing, multi-series charts with
# legend/toggle/tooltip/accessible summary, Actual vs Expected vs Required).
# Publishes an API-readable check run per viewport ("V3 final visual
# evidence <viewport>": "Real Chromium <viewport>: N passed / M failed").
# Nothing is deployed.

on:
  push:
    branches: [arena/01a087c7-habbit-trackerrr]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  browser:
    name: Chromium ${{ matrix.viewport }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        viewport: [390x844, 430x932, 1440x900]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Chromium runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libnspr4 libnss3
      - run: npm run build
      - name: V3 final visual QA (no deployment)
        env:
          V3_QA_VIEWPORT: ${{ matrix.viewport }}
        run: |
          set -euo pipefail
          mkdir -p qa/shots/v3final
          npm run preview -- --host 0.0.0.0 --port 4173 --strictPort > qa/shots/v3final/server.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID"' EXIT
          # A cold runner can take well over 30 s to bring the preview up; a
          # readiness timeout here is infrastructure, not evidence. Wait up to
          # 120 s and print the server log if it still is not serving.
          node --input-type=module -e '
            for (let i = 0; i < 240; i++) {
              try { if ((await fetch("http://127.0.0.1:4173/")).ok) process.exit(0) } catch {}
              await new Promise(r => setTimeout(r, 500));
            }
            process.exit(1);
          ' || { echo "::error::vite preview did not become ready on 4173"; cat qa/shots/v3final/server.log; exit 1; }
          node qa/v3-final-visual.mjs http://localhost:4173 2>&1 | tee qa/shots/v3final/browser.log
          exit "${PIPESTATUS[0]}"
      - name: Publish API-readable Chromium diagnostics
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QA_PROOF_DIR: qa/shots/v3final
          QA_PROOF_NAME: V3 final visual evidence
          QA_PROOF_SCRIPT: qa/v3-final-visual.mjs
          QA_PROOF_VIEWPORT: ${{ matrix.viewport }}
        run: node qa/publish-browser-proof.mjs
      - name: Upload Chromium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-final-chromium-${{ matrix.viewport }}
          path: qa/shots/v3final/
          retention-days: 14
      - name: Publish result
        if: always()
        run: |
          echo '## Chromium ${{ matrix.viewport }}' >> "$GITHUB_STEP_SUMMARY"
          cat qa/shots/v3final/browser.log >> "$GITHUB_STEP_SUMMARY" || true
  checks:
    name: Final unit, lint, build and schema checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run test:schema
      - run: git diff --check HEAD^ HEAD
