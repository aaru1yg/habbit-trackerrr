name: V3 public production verification

# One-shot V3 RELEASE verification — GitHub-hosted Chromium against the PUBLIC
# GitHub Pages deployment (never localhost). Runs automatically when pushed to
# the release session branch (workflows API lookup is default-branch-only, so
# dispatch-by-name cannot address a session-branch-only workflow), pinned to
# the production merge commit below. Also dispatchable by ID if needed.
#
# Steps: (1) poll the live site until its build-id meta matches the pinned
# production commit (fails loudly on mismatch — the deployed bytes must be
# provably built from the merge commit); (2) run the V3 battery
# (qa/v3-public-visual.mjs: the merged qa/v3-final-visual.mjs battery,
# byte-identical, plus the real TEST_A sign-in the deployed AuthGate requires)
# against https://aaru1yg.github.io/habbit-trackerrr/ at 390x844, 430x932
# and 1440x900; (3) publish per-viewport check runs + artifacts.
#
# Release tooling only — lives on the release session branch, never merged
# to main. Nothing is deployed from here.

on:
  push:
    branches: [arena/01a08b66-habbit-trackerrr]
    paths: [.github/workflows/v3-public-verify.yml, qa/v3-public-visual.mjs]
  workflow_dispatch: # manual re-run of the same pinned verification (SHA is hardcoded below)

permissions:
  contents: read
  checks: write


# The battery signs in as the shared pre-confirmed TEST_A account (the only
# way through the deployed AuthGate), so this workflow serializes with every
# other live-account consumer exactly like verify-live-site.yml does.
concurrency:
  group: live-qa-shared-accounts
  cancel-in-progress: false
jobs:
  build-id:
    name: Live build identity
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Assert the public site serves the production commit
        env:
          PRODUCTION_SHA: 7cbdab9d583f5bc9841d6d87b9c8683f1ca29370
        run: |
          set -euo pipefail
          SHORT="$(echo "$PRODUCTION_SHA" | cut -c1-7)"
          echo "expecting live build-id: $SHORT (full: $PRODUCTION_SHA)"
          # The Pages CDN can lag the deployment event by a few minutes; poll
          # up to ~10 minutes for the expected build-id.
          for i in $(seq 1 120); do
            HTML="$(curl -fsSL --max-time 30 'https://aaru1yg.github.io/habbit-trackerrr/')" || { sleep 5; continue; }
            LIVE="$(echo "$HTML" | grep -o '<meta name="build-id" content="[^"]*"' | head -1 || true)"
            if [ "$((i % 12))" = "1" ]; then echo "attempt $i: $LIVE"; fi
            if echo "$LIVE" | grep -q "content=\"$SHORT\""; then
              echo "live build identity OK: $LIVE (attempt $i)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::public site is not serving build $SHORT after ~10 minutes (last seen: $LIVE)"
          exit 1

  browser:
    name: Public Chromium ${{ matrix.viewport }}
    needs: build-id
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        viewport: [390x844, 430x932, 1440x900]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7cbdab9d583f5bc9841d6d87b9c8683f1ca29370
      - name: Confirm harness checkout is the production commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "7cbdab9d583f5bc9841d6d87b9c8683f1ca29370"
          echo "harness commit: $(git rev-parse --short=7 HEAD) (production pin confirmed)"
      - name: Overlay the session-branch public driver
        run: |
          set -euo pipefail
          git fetch origin arena/01a08b66-habbit-trackerrr --depth 1
          git show FETCH_HEAD:qa/v3-public-visual.mjs > qa/v3-public-visual.mjs
          node --check qa/v3-public-visual.mjs
          grep -q 'Release tooling only' qa/v3-public-visual.mjs
          echo "public driver overlaid onto the production harness checkout"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Chromium runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libnspr4 libnss3
      - name: V3 battery against the PUBLIC production site
        env:
          V3_QA_VIEWPORT: ${{ matrix.viewport }}
          V3_QA_OUT: qa/shots/v3public
          REQUIRE_AUTH: '1'
          TEST_A_EMAIL: ${{ secrets.TEST_A_EMAIL }}
          TEST_A_PASSWORD: ${{ secrets.TEST_A_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p qa/shots/v3public
          node qa/v3-public-visual.mjs https://aaru1yg.github.io/habbit-trackerrr 2>&1 | tee qa/shots/v3public/browser.log
          exit "${PIPESTATUS[0]}"
      - name: Publish API-readable Chromium diagnostics
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QA_PROOF_DIR: qa/shots/v3public
          QA_PROOF_NAME: V3 public production evidence
          QA_PROOF_SCRIPT: qa/v3-public-visual.mjs
          QA_PROOF_VIEWPORT: ${{ matrix.viewport }}
          QA_PROOF_SHA: 7cbdab9d583f5bc9841d6d87b9c8683f1ca29370
        run: node qa/publish-browser-proof.mjs
      - name: Upload Chromium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-public-chromium-${{ matrix.viewport }}
          path: qa/shots/v3public/
          retention-days: 14
      - name: Publish result
        if: always()
        run: |
          echo '## Public Chromium ${{ matrix.viewport }}' >> "$GITHUB_STEP_SUMMARY"
          cat qa/shots/v3public/browser.log >> "$GITHUB_STEP_SUMMARY" || true
