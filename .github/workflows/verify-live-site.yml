name: Verify live site (migration)

# Production proof for the migration-prompt behaviour, driven by a real
# headless Chromium against the PUBLIC GitHub Pages URL.
#
#   pull_request (sync code changes) → EXPECT=fixed — production health /
#       regression monitoring: the public site always serves main (never PR
#       code), and whatever main serves must show the healthy journey (prompt
#       at most once, silent across 10 reloads and a re-login, user B scoped).
#       Before the fix shipped this same mode was the reproduce control — it
#       failed loudly on build b9640e6 (10/10 reloads + re-login), proving it
#       could detect the bug.
#   successful Pages deployment → EXPECT=fixed + build id, asserting this
#       exact commit, then verifying it.
#   workflow_dispatch → 'reproduce' asserts a KNOWN-BAD build still shows the
#       bug (harness sanity check); default 'fixed'.
#
# Accounts: TEST_A_EMAIL/TEST_A_PASSWORD (+ TEST_B_*) repository secrets if
# present; otherwise throwaway accounts are created through the real signup
# UI. If the project requires email confirmation and no secrets exist, the
# run exits 3 — an explicit, honest "cannot verify" rather than a silent pass.
# Shares those accounts with verify-supabase.yml — the shared concurrency
# group serializes the two so they never mutate the accounts concurrently.

on:
  workflow_dispatch:
    inputs:
      expect:
        description: 'fixed (expect healthy behaviour) or reproduce (expect the historical bug — harness sanity)'
        required: true
        default: 'fixed'
  pull_request:
    paths:
      - 'src/lib/cloud/**'
      - 'qa/live-migration.mjs'
      - '.github/workflows/verify-live-site.yml'
  # Verify every deployed release, not only changes to the sync directory.
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types: [completed]

permissions:
  contents: read
  actions: read

# Shares the TEST_A/TEST_B accounts with verify-supabase.yml — the two runs
# must never mutate those accounts concurrently (see the note there).
concurrency:
  group: live-qa-shared-accounts
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    name: Real browser vs public site
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Determine expectation
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # The public site always serves main (never PR code): a PR run is
            # a production health check, so it expects the healthy journey.
            echo "expect=fixed" >> "$GITHUB_OUTPUT"
            echo "build=" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "expect=${{ inputs.expect }}" >> "$GITHUB_OUTPUT"
            echo "build=" >> "$GITHUB_OUTPUT"
          else
            # Completed Pages deployment — verify the exact deployed commit.
            echo "expect=fixed" >> "$GITHUB_OUTPUT"
            echo "build=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the exact deployed Pages artifact
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: /tmp/pages-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Unpack deployed artifact
        if: github.event_name == 'workflow_run'
        run: |
          mkdir -p dist
          tar -xf /tmp/pages-artifact/artifact.tar -C dist

      # Sequential with browser tests: these scripts share TEST_A/TEST_B.
      # A partial (exit 3) result is a failure for a production release.
      - name: Real Supabase auth, persistence and cross-user RLS
        if: github.event_name == 'workflow_run'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          TEST_A_EMAIL: ${{ secrets.TEST_A_EMAIL }}
          TEST_A_PASSWORD: ${{ secrets.TEST_A_PASSWORD }}
          TEST_B_EMAIL: ${{ secrets.TEST_B_EMAIL }}
          TEST_B_PASSWORD: ${{ secrets.TEST_B_PASSWORD }}
        run: node qa/verify-supabase.mjs

      - name: Live-site migration verification
        id: verify
        continue-on-error: true
        env:
          LIVE_URL: https://aaru1yg.github.io/habbit-trackerrr/
          EXPECT: ${{ steps.mode.outputs.expect }}
          EXPECT_BUILD_ID: ${{ steps.mode.outputs.build }}
          TEST_A_EMAIL: ${{ secrets.TEST_A_EMAIL }}
          TEST_A_PASSWORD: ${{ secrets.TEST_A_PASSWORD }}
          TEST_B_EMAIL: ${{ secrets.TEST_B_EMAIL }}
          TEST_B_PASSWORD: ${{ secrets.TEST_B_PASSWORD }}
        run: |
          set +e
          node qa/live-migration.mjs 2>&1 | tee /tmp/live.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Publish result
        if: always()
        run: |
          {
            echo '## Live-site migration verification'
            echo ''
            echo '```'
            cat /tmp/live.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Mirror every verdict line as an annotation — readable from the API
          # even where raw logs/artifacts are unreachable.
          while IFS= read -r line; do
            case "$line" in
              *"✗"*) echo "::error::${line}" ;;
              *"⊘"*) echo "::warning::${line}" ;;
              *"✓"*) echo "::notice::${line}" ;;
              *"✅"*|*"live build"*|*"waiting for deploy"*|*"A:"*|*"B:"*|*"verified against"*)
                echo "::notice::${line}" ;;
            esac
          done < /tmp/live.txt

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-migration-verification
          path: /tmp/live.txt

      - name: Enforce outcome
        run: |
          CODE="${{ steps.verify.outputs.code }}"
          echo "live verification exit code: $CODE"
          if [ "$CODE" = "0" ]; then
            echo "Expectation met."
          elif [ "$CODE" = "3" ]; then
            echo "::error::PARTIAL — Supabase requires pre-confirmed accounts. Add TEST_A_EMAIL/TEST_A_PASSWORD (+ TEST_B_*) repository secrets."
            exit 1
          else
            echo "::error::Live-site verification failed."
            exit 1
          fi

      - name: Verify all V2 screens on the public URL and match every deployed byte
        if: github.event_name == 'workflow_run'
        env:
          LIVE_URL: https://aaru1yg.github.io/habbit-trackerrr/
          EXPECT_BUILD_ID: ${{ github.event.workflow_run.head_sha }}
          REQUIRE_AUTH: '1'
          TEST_A_EMAIL: ${{ secrets.TEST_A_EMAIL }}
          TEST_A_PASSWORD: ${{ secrets.TEST_A_PASSWORD }}
        run: node qa/release.mjs

      - name: Publish public browser proof
        if: always() && github.event_name == 'workflow_run'
        run: node qa/publish-release-evidence.mjs

      - name: Upload public browser screenshots and checksums
        if: always() && github.event_name == 'workflow_run'
        uses: actions/upload-artifact@v4
        with:
          name: public-release-proof
          path: qa/shots/release/
          retention-days: 14
