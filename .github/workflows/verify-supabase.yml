name: Verify Supabase (live)

# Runs the real backend proof from a GitHub runner, which has network egress
# to Supabase. Uses ONLY the public URL + publishable key, both read from
# repository secrets. No service_role key is ever referenced.
#
# Trigger manually: Actions -> "Verify Supabase (live)" -> Run workflow.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/schema.sql'
      - 'qa/verify-supabase.mjs'
      - '.github/workflows/verify-supabase.yml'

jobs:
  verify:
    name: Live auth, persistence and RLS isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fail fast if secrets are missing
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.VITE_SUPABASE_URL }}" ] || [ -z "${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" ]; then
            echo "::error::VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY are not set."
            exit 1
          fi
          echo "Both public Supabase secrets are present."

      # The script prints only pass/fail lines — never the key, never a token.
      - name: Live Supabase verification
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # Optional: two PRE-CONFIRMED accounts let the run prove the full
          # two-user isolation matrix while "Confirm email" stays enabled.
          TEST_A_EMAIL: ${{ secrets.TEST_A_EMAIL }}
          TEST_A_PASSWORD: ${{ secrets.TEST_A_PASSWORD }}
          TEST_B_EMAIL: ${{ secrets.TEST_B_EMAIL }}
          TEST_B_PASSWORD: ${{ secrets.TEST_B_PASSWORD }}
        run: node qa/verify-supabase.mjs
